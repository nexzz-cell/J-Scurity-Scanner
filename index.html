<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J Security Scanner — Active</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h2>J<span>SECURITY</span></h2>
    <span class="status">● SYSTEM ONLINE</span>
  </header>
  <main class="container">
    <section class="hero">
      <h1>WEB SECURITY<br>SCANNER_</h1>
      <p>Active vulnerability assessment — SQLi / XSS / IDOR / SSRF / Open Redirect.</p>
    </section>
    <section class="panel">
      <label for="target">TARGET URL</label>
      <input id="target" type="url" placeholder="https://target.com/" required>

      <div class="sessions">
        <div>
          <label for="cookieA">Session A (cookie, optional)</label>
          <input id="cookieA" type="text" placeholder="sid=abc123; csrftoken=...">
        </div>
        <div>
          <label for="cookieB">Session B (cookie, optional)</label>
          <input id="cookieB" type="text" placeholder="sid=xyz789; csrftoken=...">
        </div>
      </div>

      <button id="scanBtn">START ACTIVE SCAN →</button>
    </section>
    <section class="panel">
      <div class="console-head"><h3>TERMINAL OUTPUT</h3><span>LIVE LOG</span></div>
      <pre id="console">[SYSTEM] Waiting for target...</pre>
    </section>
    <section class="panel">
      <h3>SCAN RESULTS</h3>
      <div id="results">No scan performed.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
